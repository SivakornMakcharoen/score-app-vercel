<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>กรอกคะแนนกิจกรรม</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2321;--paper:#f7f6f1;--teal:#0f4c4a;--amber:#fff1c9;--amber-d:#b27a00;--red:#b3261e;--line:#d9d6c9}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Prompt,system-ui,sans-serif;line-height:1.5}
main{max-width:460px;margin:0 auto;padding:20px 16px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
h1{color:var(--red);font-size:1.5rem;text-align:center;margin:8px 0 16px}
h2{font-size:1.2rem;margin:0 0 14px}
.warn{background:var(--amber);border-left:5px solid var(--amber-d);padding:12px 14px;border-radius:6px}
.warn ul{margin:8px 0 0;padding-left:20px}
.chk{display:flex;gap:10px;align-items:center;margin:16px 0}
.chk input{width:20px;height:20px}
label{display:block;margin-bottom:14px;font-weight:600}
label input:not([type=checkbox]){display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:8px;background:var(--teal);color:#fff;font:600 1.05rem Prompt,sans-serif;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid #2b8a86;outline-offset:2px}
.err{color:var(--red);min-height:1.4em;margin:8px 0}
.row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.lbl{flex:1;font-weight:600;font-size:.95rem}.lbl small{display:block;font-weight:400;color:#5b625f}
.rb{width:40px;height:40px;border-radius:50%;border:2px solid var(--teal);background:#fff;color:var(--teal);font-size:1.4rem;line-height:1;cursor:pointer}
.num{width:60px;height:40px;text-align:center;border:2px solid var(--ink);border-radius:6px;font:600 1.1rem Prompt,sans-serif;background:#fafafa}
.tot{text-align:right;font-size:1.05rem}
.center{text-align:center}
.ok{width:84px;height:84px;margin:0 auto 12px;border:4px solid var(--teal);border-radius:50%;color:var(--teal);font-size:3rem;line-height:76px}
.big{font-size:1.4rem}.big b{color:var(--teal);font-size:2.2rem}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.92rem}td{padding:6px 4px;border-top:1px solid var(--line)}td:last-child{text-align:right}
.note{color:#5b625f;font-size:.9rem}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
#modal .card{max-width:380px;width:100%}
.btns{display:flex;gap:10px;margin-top:16px}
</style>
</head>
<body>
<main id="app"></main>
<div id="modal" hidden></div>
<script src="/app.js"></script>
</body>
</html>
